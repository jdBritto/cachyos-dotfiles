# Generado por tema.sh (tema {{id}}): no editar
[main]
font=JetBrainsMono Nerd Font:size=11
prompt="  "
icon-theme={{iconos}}
icons-enabled=yes
terminal={{dir}}/scripts/terminal.sh -e
layer=overlay
width=42
lines=10
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=26
letter-spacing=0
image-size-ratio=0.5
exit-on-keyboard-focus-loss=yes

[colors]
background={{bg}}ee
text={{fg}}ff
prompt={{acento}}ff
placeholder={{fg_dim}}ff
input={{fg}}ff
match={{acento}}ff
selection={{acento}}ff
selection-text={{bg}}ff
selection-match={{bg}}ff
counter={{fg_dim}}ff
border={{acento}}ff

[border]
width=2
radius=14

[key-bindings]
cancel=Escape Control+g Mod4+space
