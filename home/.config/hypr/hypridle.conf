# Inactividad: atenuar, bloquear, apagar pantalla y suspender.
general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 4 min: bajar el brillo
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: bloquear
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: apagar la pantalla
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

# 30 min: suspender (solo con bateria; enchufado no se suspende)
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -1)" = 1 ] || systemctl suspend
}
