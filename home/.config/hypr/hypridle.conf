# Inactividad: atenuar, bloquear, apagar pantalla y suspender.
# Los tiempos de bloquear, apagar y suspender se cambian en los ajustes de end4-pC
# (Super + Escape > Hyprland > Inactividad), que reescriben esos tres bloques.

# Bloqueo de end4-pC; si la interfaz no esta en marcha, hyprlock
$lock_cmd = pidof qs quickshell >/dev/null && hyprctl dispatch 'hl.dsp.global("quickshell:lock")' || pidof hyprlock || hyprlock
# Solo suspende con bateria: enchufado no se suspende
$suspend_cmd = ~/.config/hypr/scripts/suspender.sh

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'
    # Espera (hasta 3 s) a que se vea el bloqueo antes de suspender
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
}

# 4 min: bajar el brillo (al volver se restaura)
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    on-timeout = $suspend_cmd
}
