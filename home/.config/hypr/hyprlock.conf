# Pantalla de bloqueo con los colores del tema (Super + Ctrl + L)
source = ~/.config/hypr/generado/hyprlock-colores.conf

$fuente = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = suave, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, suave
    animation = fadeOut, 1, 5, suave
    animation = inputFieldDots, 1, 2, suave
}

background {
    monitor =
    path = $fondo
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.2
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffee)
    font_size = 110
    font_family = $fuente ExtraBold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%A %d de %B" | sed 's/^./\U&/'
    color = $acento
    font_size = 20
    shadow_passes = 2
    shadow_size = 3
    font_family = $fuente
    position = 0, 110
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text =    $USER
    color = rgba(ffffffbb)
    font_size = 14
    font_family = $fuente
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = 16
    inner_color = $superficie
    outer_color = $acento $acento2 45deg
    check_color = $acento2
    fail_color = $urgente
    font_color = $fg
    font_family = $fuente
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    fail_text = <b>Contraseña incorrecta ($ATTEMPTS)</b>
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    capslock_color = $aviso
    position = 0, -80
    halign = center
    valign = center
}

# Distribucion del teclado y bloqueo de mayusculas
label {
    monitor =
    text = $LAYOUT
    color = rgba(ffffff88)
    font_size = 11
    font_family = $fuente
    position = 0, -130
    halign = center
    valign = center
}

# Logo Parrot abajo
label {
    monitor =
    text = Parrot OS  ·  Hyprland
    color = rgba(ffffff88)
    font_size = 11
    font_family = $fuente
    position = 0, 30
    halign = center
    valign = bottom
}
