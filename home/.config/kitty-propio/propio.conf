# Lo propio de kitty. Vive fuera de ~/.config/kitty porque el setup de ii reemplaza esa
# carpeta al actualizar; ~/.config/kitty/kitty.conf lo incluye en su ultima linea.

# zsh es la terminal principal (Super + Enter); fish, la desplegable (Super + |)
shell /usr/bin/zsh
map kitty_mod+alt+f   launch --type=tab --cwd=current fish
map kitty_mod+alt+z   launch --type=tab --cwd=current zsh

# Paneles
enabled_layouts splits, stack
map ctrl+shift+enter  launch --location=split --cwd=current
map ctrl+shift+\      launch --location=vsplit --cwd=current
map ctrl+shift+minus  launch --location=hsplit --cwd=current
map alt+left          neighboring_window left
map alt+right         neighboring_window right
map alt+up            neighboring_window up
map alt+down          neighboring_window down
map ctrl+shift+z      toggle_layout stack
map ctrl+shift+t      new_tab_with_cwd

# Opacidad: Ctrl+Shift+A y luego M (mas), L (menos), D (normal)
map ctrl+shift+a>m    set_background_opacity +0.05
map ctrl+shift+a>l    set_background_opacity -0.05
map ctrl+shift+a>d    set_background_opacity default
dynamic_background_opacity yes
